[opencti_indicators]
field.id = string
field.name = string
field.pattern = string
field.revoked = bool
field.type = string
field.value = string
field.detection = bool
field.score = number
field.main_observable_type = string
field.confidence = number
# labels, markings and indicator_types hold a list of values. They are left
# untyped on purpose: declaring them as "string" makes the KV store coerce the
# array and only one of the values is kept.
field.created_by = string
field.valid_from = string
field.valid_until = string
field.added_at = string
field.input_name = string
field.stream_id = string

[TA_opencti_add_on_checkpointer]
field.state = string

[opencti_indicators_composite]
# Indicators whose STIX pattern matches several attributes of the same object,
# for instance a file carrying both its hash and its name, or a network traffic
# carrying an address, a port and a protocol.
# One row is one alternative of the pattern: every column listed in
# match_fields has to match within the same event for the indicator to be seen.
# _key is <indicator id>:<alternative index>
field.indicator_id = string
field.object_type = string
field.match_fields = string
# match columns, named after the Splunk CIM fields they are compared with
field.file_hash = string
field.file_name = string
field.file_path = string
field.src_ip = string
field.dest_ip = string
field.dest = string
field.src_port = number
field.dest_port = number
field.transport = string
field.url = string
field.url_domain = string
field.query = string
field.http_user_agent = string
field.user = string
field.src_mac = string
field.dest_mac = string
field.registry_key_name = string
field.registry_value_name = string
field.process = string
field.recipient = string
field.src_user = string
field.subject = string
# indicator metadata, mirrored from the indicator itself
field.name = string
field.pattern = string
field.description = string
field.score = number
field.detection = bool
field.confidence = number
field.revoked = bool
field.main_observable_type = string
field.created_by = string
field.valid_from = string
field.valid_until = string
field.added_at = string
field.input_name = string
field.stream_id = string
# labels, markings and indicator_types stay untyped so the KV store keeps the
# whole list instead of coercing it to a single value
accelerated_fields.file_match = {"file_hash": 1, "file_name": 1}
accelerated_fields.network_match = {"dest_ip": 1, "dest_port": 1}
accelerated_fields.indicator = {"indicator_id": 1}
