#
# Indicator Collections
#
[opencti_lookup]
external_type = kvstore
collection = opencti_indicators
fields_list = _key, id, name, pattern, revoked, type, value, detection, score, main_observable_type, confidence, labels, created_by, markings, valid_from, valid_until, indicator_types, added_at, input_name, stream_id

#
# Composite indicator collection
#
# Match on the columns an indicator actually needs, for example:
#   | lookup opencti_composite_lookup file_hash file_name OUTPUT indicator_id name score
#   | lookup opencti_composite_lookup dest_ip dest_port transport OUTPUT indicator_id name score
# Every field given to the lookup command has to be present in the event, so
# use the combination listed in the match_fields column of the row.
[opencti_composite_lookup]
external_type = kvstore
collection = opencti_indicators_composite
fields_list = _key, indicator_id, object_type, match_fields, file_hash, file_name, file_path, src_ip, dest_ip, dest, src_port, dest_port, transport, url, url_domain, query, http_user_agent, user, src_mac, dest_mac, registry_key_name, registry_value_name, process, recipient, src_user, subject, name, pattern, description, score, detection, confidence, revoked, main_observable_type, labels, markings, indicator_types, created_by, valid_from, valid_until, added_at, input_name, stream_id
