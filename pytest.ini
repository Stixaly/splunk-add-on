[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    unit: exercises a single function or module
    regression: pins a behaviour that was wrong once and must stay fixed
# The vendored splunklib uses invalid escape sequences in a few regular
# expressions. That is upstream code the add-on only ships, not owns.
filterwarnings =
    ignore:invalid escape sequence:SyntaxWarning
    ignore::DeprecationWarning:stix2.*
